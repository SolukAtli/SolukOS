# SolukOS - kitty temel ayarlari. Renkler ayri (scripts/theme.sh tarafindan
# yazilan theme.conf'tan geliyor) - Ayarlar > Theme Manager'dan Soluk/Matrix/
# Nord secince bu dosyaya dokunmadan sadece theme.conf guncellenir.

include ${HOME}/.config/soluk/current-theme/kitty-theme.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0

background_opacity 0.92
window_padding_width 12

cursor_shape beam
cursor_blink_interval 0.5

confirm_os_window_close 0
