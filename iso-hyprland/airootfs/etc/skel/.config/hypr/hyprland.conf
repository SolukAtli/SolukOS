# SolukOS Hyprland Edition - temel konfigurasyon (Faz 1)

monitor=,preferred,auto,1

exec-once = hyprpaper
exec-once = polkit-kde-agent

env = XCURSOR_SIZE,24

input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7f9fbfee)
    col.inactive_border = rgba(1c1f24aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
    }
}

animations {
    enabled = true
    bezier = solukos, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, solukos
    animation = fade, 1, 4, solukos
    animation = workspaces, 1, 4, solukos
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
# Not: dosya yoneticisi/launcher Faz 3-4'te eklenecek
bind = $mainMod, F, fullscreen,
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
