# SolukOS Hyprland Edition - temel konfigurasyon (Faz 1)

monitor=,preferred,auto,1

source = $HOME/.config/soluk/current-theme/hypr-theme.conf

exec-once = hyprpaper
exec-once = waybar
exec-once = polkit-kde-agent
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = rm -f $HOME/.config/wob.sock && mkfifo $HOME/.config/wob.sock && tail -f $HOME/.config/wob.sock | wob

env = XCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark

$WOBSOCK = $HOME/.config/wob.sock

input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $solukos_accent
    col.inactive_border = $solukos_bg
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
    }
}

animations {
    enabled = true
    bezier = solukos, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, solukos
    animation = fade, 1, 4, solukos
    animation = workspaces, 1, 4, solukos
}

dwindle {
    preserve_split = true
}

$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = , Print, exec, grim - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, F, fullscreen,
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Ses / parlaklik (kilit ekranindayken de calissin diye "bindel")
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioRaiseVolume, exec, wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}' > $WOBSOCK
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioLowerVolume, exec, wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}' > $WOBSOCK
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ -q
bindel = , XF86MonBrightnessUp, exec, brightnessctl -m | awk -F, '{print int($4)}' > $WOBSOCK
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- -q
bindel = , XF86MonBrightnessDown, exec, brightnessctl -m | awk -F, '{print int($4)}' > $WOBSOCK
