# SolukOS Hyprland Edition
# Temiz, cam etkili, dock'suz varsayılan kurulum

monitor=,preferred,auto,1

# --- Tema renkleri (fallback) ---
# current-theme yoksa bile sistem açılır.
$solukos_bg         = rgba(1c1f24ee)
$solukos_bg_solid   = rgba(1c1f24ff)
$solukos_accent     = rgba(7f9fbfee)
$solukos_text       = rgba(c0c8d0ff)
$solukos_inactive   = rgba(1c1f24aa)

# Aktif temayı yükle (varsa override eder)
source = $HOME/.config/soluk/themes/solukos/hypr-theme.conf

# --- Başlangıç uygulamaları ---
exec-once = hyprpaper
exec-once = waybar
exec-once = polkit-kde-agent
exec-once = mako
exec-once = blueman-applet
exec-once = soluk-welcome
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = rm -f $HOME/.config/wob.sock && mkfifo $HOME/.config/wob.sock && tail -f $HOME/.config/wob.sock | wob

# Masaüstü ikonları (pcmanfm-qt)
exec-once = pcmanfm-qt --desktop --profile solukos

env = XCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,qt5ct

$WOBSOCK = $HOME/.config/wob.sock
$mainMod = SUPER

# --- Giriş ---
input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
    sensitivity = 0
}

# --- Genel ---
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = $solukos_accent
    col.inactive_border = $solukos_inactive
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
}

# --- Görünüm (cam efekti) ---
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    # Aktif / pasif pencere şeffaflığı
    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(0,0,0,0.35)
    }

    dim_inactive = false
}

# --- Animasyonlar ---
animations {
    enabled = true
    bezier = solukos, 0.16, 1, 0.3, 1
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, solukos, popin 80%
    animation = windowsOut, 1, 3, solukos, popin 80%
    animation = fade, 1, 3, solukos
    animation = border, 1, 4, solukos
    animation = workspaces, 1, 6, solukos, slide
}

dwindle {
    preserve_split = true
    smart_split = false
}

# --- Kısayollar ---
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, soluk-powermenu
bind = $mainMod, slash, exec, soluk-cheatsheet
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, thunar
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, F1, exec, kitty --class soluk-fastfetch --hold -e fastfetch
bind = $mainMod, F2, exec, kitty --class soluk-music --hold -e rmpc -t ~/.config/soluk/themes/solukos/rmpc-theme.ron
bind = $mainMod, F3, exec, kitty --class soluk-files -e yazi

# Ekran görüntüsü
bind = , Print, exec, grim - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -

# Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Odak
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Ses / parlaklık
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioRaiseVolume, exec, wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}' > $WOBSOCK
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioLowerVolume, exec, wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}' > $WOBSOCK
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ -q
bindel = , XF86MonBrightnessUp, exec, brightnessctl -m | awk -F, '{print int($4)}' > $WOBSOCK
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- -q
bindel = , XF86MonBrightnessDown, exec, brightnessctl -m | awk -F, '{print int($4)}' > $WOBSOCK

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
