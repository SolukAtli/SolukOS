---
# Bu, "shellprocess@fixmkinitcpio" olarak initcpiocfg'den ONCE calisir
# (settings.conf'taki sequence'e bak). Canli ISO'nun archiso'ya ozel
# mkinitcpio ayarlarini (udev + archiso hook - USB medyasi arar) hedef
# sistemden kaldirip standart Arch varsayilanini koyar. Aksi halde kurulu
# sistem, USB'si olmadigi icin acilista USB medyasi aramaya calisip
# acilamaz.
dontChroot: false
timeout: 15
script:
    - "cp /opt/solukos-target-mkinitcpio/linux.preset /etc/mkinitcpio.d/linux.preset"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
