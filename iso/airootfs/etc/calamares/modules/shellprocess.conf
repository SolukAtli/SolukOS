---
# unpackfs canli sistemin TAMAMINI hedefe kopyaliyor - bu, Faz 1/3'te
# eklenen "canli test kullanicisi olustur" servislerini de (solukos-
# live-user.service, solukos-cli-setup.service) hedefe tasiyor demek.
# Bunlari devre disi birakmazsak, kurulu sistem ilk acilista Calamares'in
# az once olusturdugu gercek kullanicinin yaninda gereksiz bir "soluk"
# test kullanicisi daha yaratmaya calisir. "-" ile baslayan satirlar,
# dosya/sembolik-baglanti zaten yoksa hata vermeden devam eder.
dontChroot: false
timeout: 15
script:
    - "-systemctl disable solukos-live-user.service"
    - "-systemctl disable solukos-cli-setup.service"
