---
# SolukOS Linux icin disk bolumleme yapilandirmasi.
#
# Kaynaklar: Calamares'in resmi partition.conf'u (calamares/calamares repo)
# + gercek calisan ornekler (habr.com/en/articles/654755, Arch forumlari).
#
# BILINEN RISK: Calamares 3.4.0'da, efiSystemPartition tanimliyken Legacy
# BIOS modunda kurulum yapilirsa GRUB kurulumu sessizce atlanabiliyor
# (codeberg.org/Calamares/calamares/issues/2460). Bizim ana senaryomuz
# UEFI oldugu icin simdilik risk dusuk, ama BIOS modunda kurulum
# denenirse bu bilinmeli.

efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300M
efiSystemPartitionName: ESP

userSwapChoices:
    - none    # Swap yok
    - small   # 4GB'a kadar
    - suspend # Ana bellek kadar (hazirda bekletme icin)
    - file    # Swap dosyasi (bolum yerine)

alwaysShowPartitionLabels: true

# Basit ve net: secilen diski tamamen sil, otomatik bolumlendir.
# Manuel bolumleme de arayuzde secenek olarak kalir.
initialPartitioningChoice: erase
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "f2fs", "xfs"]

# Hem GPT (UEFI) hem msdos/MBR (Legacy BIOS) bolum tablosu desteklensin.
requiredPartitionTableType:
    - gpt
    - msdos
