---
# SolukOS Linux icin kullanici olusturma yapilandirmasi.
# Gruplar, solukos-live-user.service'in canli kullanici icin kullandigi
# ayni setle tutarli (wheel = sudo yetkisi).

defaultGroups:
    - wheel
    - audio
    - video
    - storage
    - optical
    - network
    - power

autologinGroup: autologin
doAutologin: false

sudoersGroup: wheel
setRootPassword: true
doReusePassword: false

availableShells:
    - /usr/bin/zsh
    - /usr/bin/bash

userShell: /usr/bin/zsh

avatarFilePath: ~/.face
