---
# SolukOS Linux icin unpackfs yapilandirmasi.
#
# archiso'nun canli squashfs'ini (airootfs.sfs) ve kernel'i hedef diske
# kopyalar. Yol, profiledef.sh'deki install_dir="solukos" ayarina gore
# ayarlandi (resmi/varsayilan archiso profillerinde "arch" olur, bizde
# degil - bu farki kacirmak "source file does not exist" hatasina yol
# acar).
unpack:
- source: "/run/archiso/bootmnt/solukos/x86_64/airootfs.sfs"
  sourcefs: "squashfs"
  destination: ""
- source: "/run/archiso/bootmnt/solukos/boot/x86_64/vmlinuz-linux"
  sourcefs: "file"
  destination: "/boot/vmlinuz-linux"
