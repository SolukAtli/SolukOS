---
# SolukOS Linux icin Calamares ana yapilandirmasi.
# Modul sirasi, resmi Calamares deposundaki (calamares/calamares)
# settings.conf'tan birebir alindi.
#
# DUZELTME: "initramfs" modulu sequence'den kaldirildi. Bu modul SADECE
# Debian tabanli dagitimlar icin (update-initramfs calistiriyor - bu komut
# Arch'ta hic yok, calamares/src/modules/initramfs/initramfs.conf'un kendi
# yorumunda "This module is specific to Debian based distros" yaziyor).
# initcpio modulu zaten Arch'in initramfs karsiligini birkac adim once
# hallediyor. Bu modul sequence'de kalirsa is basarisiz olur ve ardindan
# gelen bootloader + umount hic calismaz (GRUB kurulmaz, diskler duzgun
# unmount edilmez).

modules-search: [ local ]

instances:
- id:       fixmkinitcpio
  module:   shellprocess
  config:   shellprocess-fixmkinitcpio.conf

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - locale
    - keyboard
    - localecfg
    - fstab
    - shellprocess@fixmkinitcpio
    - initcpiocfg
    - initcpio
    - users
    - shellprocess
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader
    - umount
- show:
    - finished

branding: solukos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
