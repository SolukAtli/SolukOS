---
# SolukOS Linux icin Calamares ana yapilandirmasi.
# Modul sirasi, resmi Calamares deposundaki (calamares/calamares)
# settings.conf'tan birebir alindi.

modules-search: [ local ]

instances:
- id:       fixmkinitcpio
  module:   shellprocess
  config:   shellprocess-fixmkinitcpio.conf

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - locale
    - keyboard
    - localecfg
    - fstab
    - shellprocess@fixmkinitcpio
    - initcpiocfg
    - initcpio
    - users
    - shellprocess
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - initramfs
    - bootloader
    - umount
- show:
    - finished

branding: solukos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
