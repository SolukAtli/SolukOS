# SolukOS - neofetch minimal override.
# Sadece ihtiyacimiz olan degerleri set ediyoruz; geri kalani neofetch'in
# kendi varsayilanlarindan geliyor (config.conf kismi override edilebilir,
# tam dosya olmak zorunda degil).

print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    info cols
}

# Salt ascii sanatimizi kullan (banner.txt'deki buyuk at yerine,
# terminale sigan kucuk/kompakt versiyon).
backend="ascii"
image_source="/usr/share/solukos/ascii/logo.txt"
ascii_colors=(4 6 6 8 8 6)
ascii_bold="on"
gap=3
